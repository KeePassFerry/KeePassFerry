# Tests bei jedem Push auf main und jedem Pull Request (dieselben Schritte laufen auch vor jedem Release in release.yml):
# - Erweiterung: Vitest
# - Plugin und Host (tests/KeePassFerry.Tests): Kryptobausteine gegen Testvektoren, Nachrichtenrahmen, Handshake und
#   Kopplung über eine echte Named Pipe, Passkey-Daten und -Signaturen, Wegwerf-Datenbank; dazu der echte TypeScript-Client
#   der Erweiterung gegen den echten Plugin-Server. Ohne KeePass-Oberfläche, nur mit erzeugten Schlüsseln und Testdaten.
# Was hier nicht abgedeckt ist, steht in tests/README.md.
# Nach bestandenen Tests (nicht bei Pull Requests) zusätzlich ein Testbuild als Artefakt, siehe TESTING.md.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
      - "docs/**"
      - "branding/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
      - "docs/**"
      - "branding/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  KEEPASS_VERSION: "2.61.1"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: KeePass als Build-Referenz laden
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE "KeePassDEV"
          $url = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/$env:KEEPASS_VERSION/KeePass-$env:KEEPASS_VERSION.zip"
          curl.exe -L --fail --retry 3 -A "Wget/1.21" -o keepass.zip $url
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive keepass.zip -DestinationPath $dir -Force
          New-Item -ItemType Directory -Force (Join-Path $dir "Plugins") | Out-Null
          if (-not (Test-Path (Join-Path $dir "KeePass.exe"))) { throw "KeePass.exe fehlt" }

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Plugin bauen
        shell: pwsh
        run: |
          msbuild plugin/KeePassFerry/KeePassFerry.csproj -t:Build -p:Configuration=Release -p:TargetFrameworkVersion=v4.8 -v:minimal -nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Erweiterung testen
        working-directory: extension
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx vitest run
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Plugin und Host testen
        shell: pwsh
        env:
          KPF_REQUIRE_INTEROP: "1"
        run: |
          dotnet test tests/KeePassFerry.Tests -c Release --nologo --logger "console;verbosity=normal"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Testbuild zum Ausprobieren vor dem nächsten Release (Anleitung: TESTING.md). Nur nach bestandenen Tests und nicht
      # bei Pull Requests. Feste Adressen ohne Anmeldung: Vorab-Release "testing" (Pre-release, nie "latest"), das jeder
      # Push auf main ersetzt. Unsigniert; Store, Setup-Link (releases/latest) und Update-Prüfung (version.txt) unberührt
      - name: Testbuild schnüren
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $pkg = (Get-Content extension/package.json -Raw | ConvertFrom-Json).version
          "TESTBUILD=$pkg-dev-$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $out = "testbuild"
          $plug = "$out/KeePassFerry"
          New-Item -ItemType Directory -Force $plug | Out-Null
          $bin = "plugin/KeePassFerry/bin/Release"
          foreach ($f in "KeePassFerry.dll", "Jayrock.dll", "Jayrock.Json.dll") { Copy-Item "$bin/$f" $plug }
          # Host (über die Tests gebaut), falls er sich geändert hat
          $hostBin = "host/KeePassFerryHost/bin/Release/net48"
          if (Test-Path "$hostBin/KeePassFerryHost.exe") { Copy-Item "$hostBin/KeePassFerryHost.exe", "$hostBin/KeePassFerryHost.exe.config" $plug }
          Push-Location extension
          npm run build-chrome:prod
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item extension/extension "$out/extension-chrome-edge" -Recurse
          Push-Location extension
          npm run build-firefox:prod
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item extension/extension "$out/extension-firefox" -Recurse
          Get-ChildItem $out -Recurse -Filter *.map | Remove-Item
          # Je ein Zip zum Herunterladen; der Inhalt der Erweiterungs-Zips liegt direkt im Wurzelordner (zum Entpacken
          # und "Entpackt laden" bzw. in Firefox manifest.json auswählen)
          Compress-Archive -Path $plug -DestinationPath "$out/KeePassFerry-Testbuild-Plugin.zip"
          Compress-Archive -Path "$out/extension-chrome-edge/*" -DestinationPath "$out/KeePassFerry-Testbuild-Chrome-Edge.zip"
          Compress-Archive -Path "$out/extension-firefox/*" -DestinationPath "$out/KeePassFerry-Testbuild-Firefox.zip"

      # Weitergabe an den Job, der veröffentlicht (dieser Job bleibt nur lesend)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'pull_request'
        with:
          name: testbuild
          path: testbuild/KeePassFerry-Testbuild-*.zip
          retention-days: 1

  # Vorab-Release "testing" mit den Testbuild-Zips (nur Push auf main). Einziger Job mit Schreibrecht
  publish-testbuild:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: testbuild
          path: testbuild

      - name: Vorab-Release "testing" aktualisieren
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $sha = "${{ github.sha }}"
          $notes = @"
          Test build of ``main`` at $($sha.Substring(0, 7)) ($(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC), replaced with every change. Not signed, not a release.

          How to install it: [TESTING.md](https://github.com/${{ github.repository }}/blob/main/TESTING.md)
          "@
          gh release view testing *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create testing --prerelease --latest=false --title "Test build (main)" --notes $notes --target $sha
          } else {
            # Tag auf den neuen Stand, Beschreibung ersetzen
            gh api -X PATCH "repos/$env:GH_REPO/git/refs/tags/testing" -f sha=$sha -F force=true | Out-Null
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit testing --prerelease --latest=false --title "Test build (main)" --notes $notes
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload testing --clobber (Get-ChildItem testbuild -Filter "KeePassFerry-Testbuild-*.zip").FullName
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
