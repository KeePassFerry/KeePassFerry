<!doctype html>
<html lang="de">
<head>

    <title>Kundenkonto – Spielwiese</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="kopf">
        <a class="marke" href="index.html">Spielwiese</a>
        <nav>
            <a href="index.html">Übersicht</a>
            <a href="login.html">Anmelden</a>
            <a href="registrieren.html">Registrieren</a>
            <a href="konto.html">Kundenkonto</a>

                    <a href="2fa-einrichten.html?art=qr-svg">QR-SVG</a></li>
            </ul>
            <button type="button" id="abmelden">Abmelden</button>

    <script src="spielwiese.js"></script>
    <script>Spielwiese.initKonto();</script>
