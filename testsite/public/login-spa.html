<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anmelden ohne Neuladen – Spielwiese</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="kopf">
        <a class="marke" href="index.html">Spielwiese</a>
        <nav>
            <a href="index.html">Übersicht</a>
            <a href="login.html">Anmelden</a>
            <a href="registrieren.html">Registrieren</a>
            <a href="konto.html">Kundenkonto</a>
        </nav>
        <span id="angemeldet" class="status"></span>
    </header>
    <p class="warnung">Nur zum Testen auf diesem Rechner – hier keine echten Zugangsdaten eingeben.</p>
    <main>
        <section class="karte">
            <h1>Anmelden (ohne Neuladen)</h1>
            <form action="#" method="post">
                <label for="benutzer">E-Mail-Adresse</label>
                <input type="text" id="benutzer" name="username" autocomplete="username" required>
                <label for="passwort">Passwort</label>
                <input type="password" id="passwort" name="password" autocomplete="current-password" required>
                <div><button type="submit">Anmelden</button></div>
            <p id="fehler" class="meldung" role="alert" hidden></p>
            </form>
            <div id="willkommen" hidden>
                <p>Willkommen zurück, <strong id="willkommen-name"></strong>! Die Seite wurde nicht neu geladen.</p>
                <p><a href="konto.html">Zum Kundenkonto</a></p>
            </div>
        </section>
    </main>
    <script src="spielwiese.js"></script>
    <script>Spielwiese.initSpaLogin();</script>
</body>
</html>
