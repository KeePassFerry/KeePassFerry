<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Passwort ändern – Spielwiese</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="kopf">
        <a class="marke" href="index.html">Spielwiese</a>
        <nav>
            <a href="index.html">Übersicht</a>
            <a href="login.html">Anmelden</a>
            <a href="registrieren.html">Registrieren</a>
            <a href="konto.html">Kundenkonto</a>
        </nav>
        <span id="angemeldet" class="status"></span>
    </header>
    <p class="warnung">Nur zum Testen auf diesem Rechner – hier keine echten Zugangsdaten eingeben.</p>
    <main>
        <section class="karte">
            <h1>Passwort ändern</h1>
            <form action="konto.html" method="post">
                <input type="text" id="benutzer" name="username" autocomplete="username" hidden>
                <label for="alt">Aktuelles Passwort</label>
                <input type="password" id="alt" name="current-password" autocomplete="current-password" required>
                <label for="neu">Neues Passwort</label>
                <input type="password" id="neu" name="new-password" autocomplete="new-password" required>
                <label for="neu2">Neues Passwort wiederholen</label>
                <input type="password" id="neu2" name="new-password2" autocomplete="new-password" required>
                <div><button type="submit">Passwort ändern</button></div>
            <p id="fehler" class="meldung" role="alert" hidden></p>
            </form>
        </section>
    </main>
    <script src="spielwiese.js"></script>
    <script>Spielwiese.initPasswortAendern();</script>
</body>
</html>
