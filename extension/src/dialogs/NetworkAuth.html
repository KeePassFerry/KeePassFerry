<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>KeePassFerry</title>
    <link rel="icon" href="/assets/images/64.png"/>
    <style>
        /* Aussehen wie der Passkey-Dialog (page/PasskeyDialog.ts) */
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --text: #0f172a;
            --sub: #64748b;
            --question: #334155;
            --item-border: #e2e8f0;
            --item-hover: #93c5fd;
            --accent: #1d4ed8;
            --accent-hover: #1e40af;
            --selected-bg: #eff6ff;
            --radio: #94a3b8;
            --secondary: #f1f5f9;
            --secondary-hover: #e2e8f0;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #111827;
                --text: #f1f5f9;
                --sub: #94a3b8;
                --question: #cbd5e1;
                --item-border: #334155;
                --item-hover: #60a5fa;
                --accent: #60a5fa;
                --accent-hover: #93c5fd;
                --selected-bg: #172554;
                --secondary: #1f2937;
                --secondary-hover: #374151;
            }
        }
        :root[data-theme="dark"] {
            --bg: #111827;
            --text: #f1f5f9;
            --sub: #94a3b8;
            --question: #cbd5e1;
            --item-border: #334155;
            --item-hover: #60a5fa;
            --accent: #60a5fa;
            --accent-hover: #93c5fd;
            --selected-bg: #172554;
            --secondary: #1f2937;
            --secondary-hover: #374151;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        #i18n_root {
            height: 100%;
            flex-direction: column;
        }
        .head { display: flex; align-items: center; gap: 14px; padding: 20px 22px 8px; }
        .head svg { flex: none; }
        .heading { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; overflow-wrap: anywhere; }
        .sub { font-size: 13px; color: var(--sub); margin-top: 2px; overflow-wrap: anywhere; }
        .sub:empty { display: none; }
        .question { padding: 10px 22px 4px; font-size: 13.5px; font-weight: 600; color: var(--question); }
        /* Innenabstand größer als der Auswahlschatten (3 px), sonst schneidet der Scrollbereich ihn ab */
        .list {
            flex: 1; min-height: 0; overflow-y: auto;
            padding: 6px 22px; display: flex; flex-direction: column; gap: 8px;
        }
        .item {
            display: flex; align-items: center; gap: 12px; width: 100%; flex: none;
            padding: 11px 14px; border-radius: 12px; cursor: pointer; text-align: left;
            border: 1.5px solid var(--item-border); background: var(--bg); color: inherit; font: inherit;
            transition: border-color 0.12s, background-color 0.12s, box-shadow 0.12s;
        }
        .item:hover { border-color: var(--item-hover); }
        .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .item.selected:focus-visible { outline: none; }
        .item.selected {
            border-color: var(--accent); background: var(--selected-bg);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
        }
        .radio { width: 18px; height: 18px; flex: none; border-radius: 50%; border: 2px solid var(--radio); }
        .item.selected .radio { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 42%, transparent 46%); }
        .single .radio { display: none; }
        .single .item { cursor: default; }
        .text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
        .title { font-weight: 600; overflow-wrap: anywhere; }
        .subtitle { font-size: 12.5px; color: var(--sub); overflow-wrap: anywhere; }
        /* Eingabe, wenn KeePass noch keinen Eintrag hat */
        /* Scrollt bei zu kleinem Fenster, statt unter die Knöpfe zu laufen (deren Rand fing sonst die Klicks ab) */
        .form { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 22px; display: flex; flex-direction: column; gap: 12px; }
        .form[hidden], .list[hidden], .save[hidden] { display: none; }
        /* Ganze Zeile klickbar (Label), nur so breit wie der Inhalt plus Rand */
        .save {
            display: inline-flex; align-self: flex-start; align-items: center; gap: 10px;
            padding: 6px 10px 6px 6px; margin-left: -6px; border-radius: 8px;
            font-size: 13.5px; color: var(--text); cursor: pointer; user-select: none;
        }
        .save:hover { background: var(--secondary); }
        .save input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
        .form label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--question); }
        .form input[type="text"], .form input[type="password"] {
            font: inherit; font-size: 14px; font-weight: 400; color: var(--text); background: var(--bg);
            border: 1.5px solid var(--item-border); border-radius: 10px; padding: 8px 11px; outline: none;
        }
        .form input[type="text"]:focus, .form input[type="password"]:focus {
            border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
        }
        .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 22px 18px; }
        button.btn {
            font: inherit; font-weight: 600; border-radius: 10px; padding: 9px 16px; cursor: pointer;
            border: 1px solid transparent; transition: background-color 0.12s, box-shadow 0.12s;
        }
        button.primary { background: #1d4ed8; color: #fff; box-shadow: 0 1px 2px rgba(29, 78, 216, 0.4); }
        button.primary:hover { background: #1e40af; }
        button.secondary { background: var(--secondary); color: var(--text); }
        button.secondary:hover { background: var(--secondary-hover); }
    </style>
</head>
<body>
    <div id="i18n_root" style="display:none">
        <div class="head">
            <svg viewBox="0 0 128 128" width="36" height="36" aria-hidden="true">
                <rect x="4" y="4" width="120" height="120" rx="28" fill="#15497f"/>
                <circle cx="42" cy="47" r="15" fill="none" stroke="#fff" stroke-width="9"/>
                <path d="M57 47 H100 M88 47 V60 M99 47 V57" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M18 72 H110 L97 94 Q95 97 91 97 H37 Q33 97 31 94 Z" fill="#22c55e"/>
                <path d="M20 108 q 8.8 -7 17.6 0 t 17.6 0 t 17.6 0 t 17.6 0 t 17.6 0" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/>
            </svg>
            <div>
                <div class="heading" id="network_auth_site"></div>
                <div class="sub" id="network_auth_realm"></div>
            </div>
        </div>
        <div class="question" id="network_auth_question"></div>
        <div class="list" id="network_auth_list" role="radiogroup"></div>
        <form class="form" id="network_auth_form" hidden autocomplete="off">
            <label class="field"><span data-i18n="ferry_netauth_username"></span><input type="text" id="network_auth_username" spellcheck="false"></label>
            <label class="field"><span data-i18n="ferry_netauth_password"></span><input type="password" id="network_auth_password"></label>
            <label class="save" id="network_auth_save_row"><input type="checkbox" id="network_auth_save" checked><span data-i18n="ferry_netauth_save"></span></label>        </form>
        <div class="actions">
            <button type="button" class="btn secondary" id="network_auth_cancel" data-i18n="passkey_cancel"></button>
            <button type="button" class="btn primary" id="network_auth_ok" data-i18n="passkey_sign_in"></button>
        </div>
    </div>
    <script type="module" src="./NetworkAuth.ts"></script>
</body>
</html>
