<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="../../assets/styles/settings.css" type="text/css" rel="stylesheet">
</head>

<body>
    <div id="i18n_root" style="display:none">
        <header class="topbar">
            <svg class="logo" viewBox="0 0 128 128" width="40" height="40" aria-hidden="true">
                <rect x="4" y="4" width="120" height="120" rx="28" fill="#15497f"/>
                <circle cx="42" cy="47" r="15" fill="none" stroke="#fff" stroke-width="9"/>
                <path d="M57 47 H100 M88 47 V60 M99 47 V57" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M18 72 H110 L97 94 Q95 97 91 97 H37 Q33 97 31 94 Z" fill="#22c55e"/>
                <path d="M20 108 q 8.8 -7 17.6 0 t 17.6 0 t 17.6 0 t 17.6 0 t 17.6 0" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/>
            </svg>
            <div class="brand">
                <div class="brand-name">KeePassFerry</div>
                <div class="brand-sub" data-i18n="ferry_settings_title"></div>
            </div>
            <div class="spacer"></div>
            <div id="siteModeChooser" class="segmented" role="radiogroup">
                <input type="radio" name="siteOptionsMode" id="siteOptionsModeAll" value="all" checked>
                <label for="siteOptionsModeAll" data-i18n="all_websites"></label>
                <input type="radio" name="siteOptionsMode" id="siteOptionsModeSpecific" value="specific">
                <label for="siteOptionsModeSpecific" data-i18n="a_specific_website"></label>
            </div>
        </header>

        <div class="layout">
            <nav class="sidenav" id="ferryNav">
                <a href="#panelConnection" data-panel="panelConnection"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span data-i18n="ferry_connection_heading"></span></a>
                <a href="#panelFillingEntries" data-panel="panelFillingEntries"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7m8-3-4 4-2-2"/></svg><span data-i18n="pref_FillingEntries_heading"></span></a>
                <a href="#panelFindingEntries" data-panel="panelFindingEntries"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg><span data-i18n="pref_FindingEntries_heading"></span></a>
                <a href="#panelSavingEntries" data-panel="panelSavingEntries"><svg viewBox="0 0 24 24"><path d="M6 4h10l3 3v13H5V4zm2 0v5h7V4M8 20v-6h8v6"/></svg><span data-i18n="pref_SavingEntries_heading"></span></a>
                <a href="#panelNetworkAuthentication" data-panel="panelNetworkAuthentication"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-i18n="network_authentication"></span></a>
                <a href="#panelAppearance" data-panel="panelAppearance"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5v14a7 7 0 0 0 0-14z" fill="currentColor"/></svg><span data-i18n="pref_Appearance_heading"></span></a>
                <a href="#panelFindingForms" data-panel="panelFindingForms"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg><span data-i18n="pref_Finding_forms_heading"></span></a>
                <a href="#panelAdvanced" data-panel="panelAdvanced"><svg viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h4m4 0h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-i18n="pref_Advanced_heading"></span></a>
            </nav>

            <main class="content">
                <div id="siteChooser" class="card" style="display:none">
                    <form id="siteChooserForm" autocomplete="off">
                        <label class="field-label" for="siteChooserSearch" data-i18n="website"></label>
                        <div class="site-search">
                            <div class="search-box">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
                                <input type="text" class="form-control" name="siteChooserSearch" id="siteChooserSearch" autocomplete="off" data-i18n-attr="placeholder=website_options_search_placeholder;title=website_options_search_tooltip" />
                                <span id="siteSearchClearButton" style="display:none;">
                                    <button class="icon-btn" type="button" aria-label="clear search"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
                                </span>
                            </div>
                            <div id="siteActionButtons">
                                <button class="btn btn-primary" type="button" id="siteAddButton" style="display: none;" data-i18n="add"></button>
                                <button class="btn btn-default" type="button" id="siteEditButton" style="display: none;" data-i18n="edit"></button>
                                <button class="btn btn-danger" type="button" id="siteDeleteButton" style="display: none;" data-i18n="delete"></button>
                            </div>
                        </div>
                    </form>
                    <div id="siteList" style="display: none">
                        <table id="siteListResults">
                            <thead>
                                <tr>
                                    <th data-i18n="website"></th>
                                    <th data-i18n="target"></th>
                                    <th data-i18n="method"></th>
                                    <th data-i18n="weight"></th>
                                </tr>
                            </thead>
                            <tbody>

                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="settings">
                    <form>
                        <section class="card" id="panelConnection">
                            <h2 data-i18n="ferry_connection_heading"></h2>
                            <div class="status-row">
                                <span class="status-dot" id="ferryStatusDot"></span>
                                <div class="status-text">
                                    <div class="status-title" id="ferryStatusTitle"></div>
                                    <div class="hint" id="ferryStatusDetail"></div>
                                </div>
                            </div>
                            <div class="setting">
                                <div class="setting-text">
                                    <div class="setting-title" data-i18n="ferry_reset_pairing"></div>
                                    <div class="hint" data-i18n="ferry_reset_pairing_hint"></div>
                                </div>
                                <button class="btn btn-default" type="button" id="ferryResetPairing" data-i18n="ferry_reset_pairing_button"></button>
                            </div>
                        </section>

                        <section class="card" id="panelFillingEntries">
                            <h2 data-i18n="pref_FillingEntries_heading"></h2>
                            <h3 data-i18n="pref_automatic"></h3>
                            <div class="form-horizontal">
                                <div class="form-group formSettingGroup setting">
                                    <div class="formSettingLabel setting-text"><span data-i18n="pref_when_kee_chooses_standard_form_desc"></span></div>
                                    <div class="formSettingDropdown">
                                        <select class="form-control" id="pref_when_kee_chooses_standard_form_desc">
                                            <option value="DoNothing" data-i18n="pref_DoNothing_desc"></option>
                                            <option value="Fill" data-i18n="pref_FillForm_desc"></option>
                                            <option value="FillAndSubmit" data-i18n="pref_FillAndSubmitForm_desc"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_autoFillFormsWithMultipleMatches_label"></span><span class="hint" data-i18n="pref_fill_override_hint"></span></span><input type="checkbox" class="switch" id="pref_autoFillFormsWithMultipleMatches_label" /></label>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_autoFillFieldsWithExistingValue_label"></span></span><input type="checkbox" class="switch" id="pref_autoFillFieldsWithExistingValue_label" /></label>
                            </div>
                            <h3 data-i18n="pref_manual"></h3>
                            <div class="form-horizontal">
                                <div class="form-group formSettingGroup setting">
                                    <div class="formSettingLabel setting-text"><span data-i18n="pref_when_user_chooses_desc"></span></div>
                                    <div class="formSettingDropdown">
                                        <select class="form-control" id="pref_when_user_chooses_desc">
                                            <option value="Fill" data-i18n="pref_FillForm_desc"></option>
                                            <option value="FillAndSubmit" data-i18n="pref_FillAndSubmitForm_desc"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_fill_override_option"></span></span><input type="checkbox" class="switch" id="pref_manualFillSubmitOverridable_label" /></label>
                            </div>
                        </section>

                        <section class="card" id="panelFindingEntries">
                            <h2 data-i18n="pref_FindingEntries_heading"></h2>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_searchAllOpenDBs_label"></span></span><input type="checkbox" class="switch" id="pref_searchAllOpenDBs_label" /></label>
                            </div>
                        </section>

                        <section class="card" id="panelSavingEntries">
                            <h2 data-i18n="pref_SavingEntries_heading"></h2>
                            <div class="checkbox">
                                <label class="nonSiteSpecificField setting"><span class="setting-text"><span data-i18n="pref_notifyBarRequestPasswordSave_label"></span></span><input type="checkbox" class="switch" id="pref_notifyBarRequestPasswordSave_label"></label>
                                <div class="form-horizontal siteSpecificToggle">
                                    <div class="form-group formSettingGroup setting">
                                        <div class="formSettingLabel setting-text"><span data-i18n="pref_notifyBarRequestPasswordSave_label"></span></div>
                                        <div class="formSettingDropdown">
                                            <select class="form-control" id="requestPasswordSaveSelect">
                                                <option value="Yes" data-i18n="yes"></option>
                                                <option value="No" data-i18n="no"></option>
                                                <option value="Inherit" data-i18n="site_specific_settings_inherit"></option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="checkbox nonSiteSpecificField">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_animateWhenOfferingSave_label"></span></span><input type="checkbox" class="switch" id="pref_animateWhenOfferingSave_label" /></label>
                            </div>
                            <div class="checkbox nonSiteSpecificField">
                                <label class="setting"><span class="setting-text"><span data-i18n="show_confirmation_after_save"></span></span><input type="checkbox" class="switch" id="pref_showConfirmationAfterSave_label" /></label>
                            </div>
                            <div class="checkbox nonSiteSpecificField">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_preferToSkipWhere_label"></span></span><input type="checkbox" class="switch" id="pref_rememberMRUGroup_label" /></label>
                            </div>
                            <div class="checkbox nonSiteSpecificField">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_saveFavicons_label"></span></span><input type="checkbox" class="switch" id="pref_saveFavicons_label" /></label>
                            </div>
                        </section>

                        <section class="card" id="panelNetworkAuthentication">
                            <h2 data-i18n="network_authentication"></h2>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_when_one_matching_network_login"></span></span><input type="checkbox" class="switch" id="pref_when_one_matching_network_login" /></label>
                            </div>
                        </section>

                        <section class="card" id="panelAppearance">
                            <h2 data-i18n="pref_Appearance_heading"></h2>
                            <div class="form-horizontal">
                                <div class="form-group formSettingGroup setting">
                                    <div class="formSettingLabel setting-text"><span data-i18n="theme"></span><span class="hint" data-i18n="theme_system_preference_explanation"></span></div>
                                    <div class="formSettingDropdown">
                                        <select class="form-control" id="pref_theme_desc">
                                            <option value="" data-i18n="system_preference"></option>
                                            <option value="light" data-i18n="light"></option>
                                            <option value="dark" data-i18n="dark"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section class="card" id="panelFindingForms">
                            <h2 data-i18n="pref_Finding_forms_heading"></h2>
                            <div class="intro">
                                <p data-i18n="site_options_valid_form_intro_desc"></p>
                                <p data-i18n="site_options_list_explain_desc"></p>
                                <p data-i18n="site_options_invisible_tip_desc"></p>
                                <p class="siteSpecificToggle" data-i18n="site_specific_settings_checkbox_explanation"></p>
                            </div>
                            <div class="list-columns">
                                <fieldset class="fix-border">
                                    <legend class="fix-border" data-i18n="white_list"></legend>
                                    <div class="grid">
                                        <label for="sssWhiteFormName"><span data-i18n="form_name"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssWhiteFormName" type="text" />
                                        </div>
                                        <label for="sssWhiteFormId"><span data-i18n="form_id"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssWhiteFormId" type="text" />
                                        </div>
                                        <label for="sssWhiteFieldName"><span data-i18n="text_field_name"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssWhiteFieldName" type="text" />
                                        </div>
                                        <label for="sssWhiteFieldId"><span data-i18n="text_field_id"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssWhiteFieldId" type="text" />
                                        </div>
                                    </div>
                                </fieldset>
                                <fieldset class="fix-border">
                                    <legend class="fix-border" data-i18n="black_list"></legend>
                                    <div class="grid">
                                        <label for="sssBlackFormName"><span data-i18n="form_name"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssBlackFormName" type="text" />
                                        </div>
                                        <label for="sssBlackFormId"><span data-i18n="form_id"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssBlackFormId" type="text" />
                                        </div>
                                        <label for="sssBlackFieldName"><span data-i18n="text_field_name"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssBlackFieldName" type="text" />
                                        </div>
                                        <label for="sssBlackFieldId"><span data-i18n="text_field_id"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssBlackFieldId" type="text" />
                                        </div>
                                    </div>
                                </fieldset>
                            </div>
                            <div class="checkbox">
                                <label class="nonSiteSpecificField setting"><span class="setting-text"><span data-i18n="ignore_case"></span><span class="hint" data-i18n="ignore_case_explanation_finding_forms"></span></span><input type="checkbox" class="switch" id="pref_listMatchingIgnoreCase_label"></label>
                                <div class="form-horizontal siteSpecificToggle">
                                    <div class="form-group formSettingGroup setting">
                                        <div class="formSettingLabel setting-text"><span data-i18n="ignore_case"></span></div>
                                        <div class="formSettingDropdown">
                                            <select class="form-control" id="listMatchingIgnoreCaseSelect">
                                                <option value="Yes" data-i18n="yes"></option>
                                                <option value="No" data-i18n="no"></option>
                                                <option value="Inherit" data-i18n="site_specific_settings_inherit"></option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section class="card" id="panelAdvanced">
                            <h2 data-i18n="pref_Advanced_heading"></h2>
                            <div class="form-horizontal">
                                <div class="form-group formSettingGroup setting">
                                    <div class="formSettingLabel setting-text"><span data-i18n="pref_currentSearchTermTimeout_label"></span></div>
                                    <div class="formSettingInput narrow">
                                        <input class="form-control" id="pref_currentSearchTermTimeout_label" type="number" min="1" max="65535" step="1">
                                    </div>
                                </div>
                            </div>
                            <div class="form-horizontal">
                                <div class="form-group formSettingGroup setting">
                                    <div class="formSettingLabel setting-text"><span data-i18n="pref_keePassDBToOpen_label"></span></div>
                                    <div class="formSettingInput wide">
                                        <input class="form-control" id="pref_keePassDBToOpen_label" type="text">
                                    </div>
                                </div>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_rememberMRUDB_label"></span></span><input type="checkbox" class="switch" id="pref_rememberMRUDB_label" /></label>
                            </div>
                            <div class="form-horizontal" id="panelLogging">
                                <div class="form-group formSettingGroup setting">
                                    <div class="formSettingLabel setting-text"><span data-i18n="pref_logLevel_desc"></span></div>
                                    <div class="formSettingDropdown">
                                        <select class="form-control" id="pref_logLevel_desc">
                                            <option value="Debugging" data-i18n="pref_logLevelDebugging_label"></option>
                                            <option value="Information" data-i18n="pref_logLevelInformation_label"></option>
                                            <option value="Warnings" data-i18n="pref_logLevelWarnings_label"></option>
                                            <option value="Errors" data-i18n="pref_logLevelErrors_label"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="ferry_diag_label"></span><span class="hint" data-i18n="ferry_diag_hint"></span></span><input type="checkbox" class="switch" id="ferryDiagnostics" /></label>
                            </div>
                            <!-- Native Messaging braucht keinen Port; Feld bleibt nur für den gemeinsamen Einstellungscode -->
                            <div hidden>
                                <input id="pref_keePassRPCPort_label" type="number" min="1" max="65535" step="1">
                            </div>
                        </section>

                        <div id="hiddenOptionsPresent" class="card note" style="display: none;">
                            <span data-i18n="pref_hidden_options_present_explanation"></span>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <div class="modal" id="sitePropertiesModal" tabindex="-1" role="dialog" aria-labelledby="sitePropertiesModalLabel" style="display:none">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title" id="sitePropertiesModalLabel" data-i18n="site_properties"></h4>
                    <button type="button" class="close icon-btn" data-dismiss="modal" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
                </div>
                <div class="modal-body">
                    <div id="sitePropertiesContainer">
                        <label for="sitePropertiesValue"><span data-i18n="website"></span></label>
                        <input id="sitePropertiesValue" type="text" class="form-control" data-i18n-attr="placeholder=website_options_search_placeholder;title=website_options_search_tooltip" />
                        <div class="formFieldInfo error" id="sitePropertiesValueValidation" style="display:none"></div>
                        <label><span data-i18n="target"></span></label>
                        <div id="sitePropertiesTarget" class="segmented small">
                            <input id="sitePropertiesTargetDomain" name="sitePropertiesTarget" type="radio" value="Domain" checked />
                            <label for="sitePropertiesTargetDomain"><span>Domain</span></label>
                            <input id="sitePropertiesTargetHostname" name="sitePropertiesTarget" type="radio" value="Host" />
                            <label for="sitePropertiesTargetHostname"><span>Hostname</span></label>
                            <input id="sitePropertiesTargetPage" name="sitePropertiesTarget" type="radio" value="Page" />
                            <label for="sitePropertiesTargetPage"><span>Page</span></label>
                        </div>
                        <label><span data-i18n="method"></span></label>
                        <div id="sitePropertiesMethod" class="segmented small">
                            <input id="sitePropertiesMethodExact" name="sitePropertiesMethod" type="radio" value="Exact" checked />
                            <label for="sitePropertiesMethodExact"><span>Exact</span></label>
                            <input id="sitePropertiesMethodPrefix" name="sitePropertiesMethod" type="radio" value="Prefix" />
                            <label for="sitePropertiesMethodPrefix"><span>Prefix</span></label>
                            <input id="sitePropertiesMethodRegex" name="sitePropertiesMethod" type="radio" value="Regex" />
                            <label for="sitePropertiesMethodRegex"><span>Regex</span></label>
                        </div>
                        <label for="sitePropertiesWeight"><span data-i18n="weight"></span></label>
                        <input id="sitePropertiesWeight" type="text" class="form-control narrow" />
                        <div class="formFieldInfo hint"><span data-i18n="site_properties_weight_warning"></span></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" id="sitePropertiesCancel" data-i18n="cancel"></button>
                    <button class="btn btn-primary" type="button" id="sitePropertiesSave" data-i18n="save"></button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./main.ts"></script>
    <script type="module" src="./ferry.ts"></script>
</body>

</html>
