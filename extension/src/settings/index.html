<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="../../assets/styles/settings.css" type="text/css" rel="stylesheet">
</head>

<body>
    <div id="i18n_root" style="display:none">
        <header class="topbar">
            <svg class="logo" viewBox="0 0 128 128" width="40" height="40" aria-hidden="true">
                <rect x="4" y="4" width="120" height="120" rx="28" fill="#15497f"/>
                <circle cx="42" cy="47" r="15" fill="none" stroke="#fff" stroke-width="9"/>
                <path d="M57 47 H100 M88 47 V60 M99 47 V57" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M18 72 H110 L97 94 Q95 97 91 97 H37 Q33 97 31 94 Z" fill="#22c55e"/>
                <path d="M20 108 q 8.8 -7 17.6 0 t 17.6 0 t 17.6 0 t 17.6 0 t 17.6 0" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/>
            </svg>
            <div class="brand">
                <div class="brand-name">KeePassFerry</div>
                <div class="brand-sub" data-i18n="ferry_settings_title"></div>
            </div>
        </header>

        <div class="layout">
            <nav class="sidenav" id="ferryNav">
                <a href="#panelConnection" data-panel="panelConnection"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m7 12l5 5l-1.5 1.5a3.536 3.536 0 1 1-5-5zm10 0l-5-5l1.5-1.5a3.536 3.536 0 1 1 5 5zM3 21l2.5-2.5m13-13L21 3m-11 8l-2 2m5 1l-2 2"/></svg><span data-i18n="ferry_connection_heading"></span></a>
                <a href="#panelSecurity" data-panel="panelSecurity"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.46 20.846A12 12 0 0 1 3.5 6A12 12 0 0 0 12 3a12 12 0 0 0 8.5 3a12 12 0 0 1-.09 7.06M15 19l2 2l4-4"/></svg><span data-i18n="ferry_security_heading"></span></a>
                <a href="#panelOtpPasskeys" data-panel="panelOtpPasskeys"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M18.9 7a8 8 0 0 1 1.1 5v1a6 6 0 0 0 .8 3M8 11a4 4 0 0 1 8 0v1a10 10 0 0 0 2 6"/><path d="M12 11v2a14 14 0 0 0 2.5 8M8 15a18 18 0 0 0 1.8 6m-4.9-2a22 22 0 0 1-.9-7v-1a8 8 0 0 1 12-6.95"/></g></svg><span data-i18n="ferry_otp_passkeys_heading"></span></a>
                <a href="#panelFillingEntries" data-panel="panelFillingEntries"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3M6 3a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3m7-14h7a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-7M5 7H4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h1m12-5h.01M13 12h.01"/></svg><span data-i18n="pref_FillingEntries_heading"></span></a>
                <a href="#panelFindingEntries" data-panel="panelFindingEntries"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0-14 0m18 11l-6-6"/></svg><span data-i18n="pref_FindingEntries_heading"></span></a>
                <a href="#panelSavingEntries" data-panel="panelSavingEntries"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M6 4h10l4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2"/><path d="M10 14a2 2 0 1 0 4 0a2 2 0 1 0-4 0m4-10v4H8V4"/></g></svg><span data-i18n="pref_SavingEntries_heading"></span></a>
                <a href="#panelAppearance" data-panel="panelAppearance"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 21a9 9 0 0 1 0-18c4.97 0 9 3.582 9 8c0 1.06-.474 2.078-1.318 2.828S17.693 15 16.5 15H14a2 2 0 0 0-1 3.75A1.3 1.3 0 0 1 12 21"/><path d="M7.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0-2 0m4-3a1 1 0 1 0 2 0a1 1 0 1 0-2 0m4 3a1 1 0 1 0 2 0a1 1 0 1 0-2 0"/></g></svg><span data-i18n="pref_Appearance_heading"></span></a>
                <a href="#panelFindingForms" data-panel="panelFindingForms"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15a4 4 0 1 0 8 0a4 4 0 1 0-8 0m7.5 3.5L21 21M4 6h16M4 12h4m-4 6h4"/></svg><span data-i18n="pref_Finding_forms_heading"></span></a>
                <a href="#panelAdvanced" data-panel="panelAdvanced"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6a2 2 0 1 0 4 0a2 2 0 1 0-4 0M4 6h8m4 0h4M6 12a2 2 0 1 0 4 0a2 2 0 1 0-4 0m-2 0h2m4 0h10m-5 6a2 2 0 1 0 4 0a2 2 0 1 0-4 0M4 18h11m4 0h1"/></svg><span data-i18n="pref_Advanced_heading"></span></a>
            </nav>

            <main class="content">
                <div id="settings">
                    <form>
                        <section class="card" id="panelConnection">
                            <h2 data-i18n="ferry_connection_heading"></h2>
                            <div class="status-row">
                                <span class="status-dot" id="ferryStatusDot"></span>
                                <div class="status-text">
                                    <div class="status-title" id="ferryStatusTitle"></div>
                                    <div class="hint" id="ferryStatusDetail"></div>
                                </div>
                                <button class="btn btn-primary" type="button" id="ferryPluginUpdate" data-i18n="ferry_plugin_update_button" hidden></button>
                            </div>
                            <div class="setting">
                                <div class="setting-text">
                                    <div class="setting-title" data-i18n="ferry_reset_pairing"></div>
                                    <div class="hint" data-i18n="ferry_reset_pairing_hint"></div>
                                </div>
                                <button class="btn btn-default" type="button" id="ferryResetPairing" data-i18n="ferry_reset_pairing_button"></button>
                            </div>
                        </section>

                        <section class="card" id="panelSecurity">
                            <h2 data-i18n="ferry_security_heading"></h2>
                            <div class="setting" id="hibp">
                                <div class="setting-text">
                                    <div class="setting-title" data-i18n="ferry_setting_hibp"></div>
                                    <div class="hint" data-i18n="ferry_setting_in_keepass_hint"></div>
                                </div>
                                <button class="btn btn-default ferry-open-keepass-options" type="button" data-i18n="ferry_open_keepass_options"></button>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n-browser="ferry_setting_browserSaving"></span><span class="hint" data-i18n-browser="ferry_setting_browserSaving_hint"></span></span><input type="checkbox" class="switch" data-ferry-setting="ferryDisableBrowserPasswordSaving" /></label>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="ferry_setting_networkAuth"></span><span class="hint" data-i18n="ferry_setting_networkAuth_hint"></span></span><input type="checkbox" class="switch" data-ferry-setting="ferryNetworkAuth" /></label>
                                <label class="setting sub" data-parent-setting="ferryNetworkAuth"><span class="setting-text"><span data-i18n="pref_when_one_matching_network_login"></span></span><input type="checkbox" class="switch" id="pref_when_one_matching_network_login" /></label>
                            </div>
                        </section>

                        <section class="card" id="panelOtpPasskeys">
                            <h2 data-i18n="ferry_otp_passkeys_heading"></h2>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="ferry_setting_autoFillOtp"></span><span class="hint" data-i18n="ferry_setting_autoFillOtp_hint"></span></span><input type="checkbox" class="switch" data-ferry-setting="ferryAutoFillOtp" /></label>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="ferry_setting_detectOtpSetup"></span><span class="hint" data-i18n="ferry_setting_detectOtpSetup_hint"></span></span><input type="checkbox" class="switch" data-ferry-setting="ferryDetectOtpSetup" /></label>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="ferry_setting_passkeys"></span><span class="hint" data-i18n-browser="ferry_setting_passkeys_hint"></span></span><input type="checkbox" class="switch" data-ferry-setting="ferryPasskeys" /></label>
                            </div>
                        </section>

                        <section class="card" id="panelFillingEntries">
                            <h2 data-i18n="pref_FillingEntries_heading"></h2>
                            <h3 data-i18n="pref_automatic"></h3>
                            <div class="form-horizontal">
                                <div class="form-group formSettingGroup setting">
                                    <div class="formSettingLabel setting-text"><span data-i18n="pref_standard_form_choice_desc"></span></div>
                                    <div class="formSettingDropdown">
                                        <select class="form-control" id="pref_standard_form_choice_desc">
                                            <option value="DoNothing" data-i18n="pref_DoNothing_desc"></option>
                                            <option value="Fill" data-i18n="pref_FillForm_desc"></option>
                                            <option value="FillAndSubmit" data-i18n="pref_FillAndSubmitForm_desc"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_autoFillFormsWithMultipleMatches_label"></span><span class="hint" data-i18n="pref_fill_override_hint"></span></span><input type="checkbox" class="switch" id="pref_autoFillFormsWithMultipleMatches_label" /></label>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_autoFillFieldsWithExistingValue_label"></span></span><input type="checkbox" class="switch" id="pref_autoFillFieldsWithExistingValue_label" /></label>
                            </div>
                            <h3 data-i18n="pref_manual"></h3>
                            <div class="form-horizontal">
                                <div class="form-group formSettingGroup setting">
                                    <div class="formSettingLabel setting-text"><span data-i18n="pref_when_user_chooses_desc"></span></div>
                                    <div class="formSettingDropdown">
                                        <select class="form-control" id="pref_when_user_chooses_desc">
                                            <option value="Fill" data-i18n="pref_FillForm_desc"></option>
                                            <option value="FillAndSubmit" data-i18n="pref_FillAndSubmitForm_desc"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_fill_override_option"></span></span><input type="checkbox" class="switch" id="pref_manualFillSubmitOverridable_label" /></label>
                            </div>
                            <h3 data-i18n="ferry_filling_more"></h3>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="ferry_setting_fieldIcons"></span><span class="hint" data-i18n="ferry_setting_fieldIcons_hint"></span></span><input type="checkbox" class="switch" data-ferry-setting="ferryShowFieldIcons" /></label>
                            </div>
                            <div class="checkbox" id="clipboard">
                                <label class="setting"><span class="setting-text"><span data-i18n="ferry_setting_clipboardRead"></span><span class="hint" data-i18n="ferry_setting_clipboardRead_hint"></span></span><input type="checkbox" class="switch" id="ferryClipboardRead" /></label>
                            </div>
                        </section>

                        <section class="card" id="panelFindingEntries">
                            <h2 data-i18n="pref_FindingEntries_heading"></h2>
                            <div class="setting" id="matchAccuracy">
                                <div class="setting-text">
                                    <div class="setting-title" data-i18n="ferry_setting_matchAccuracy"></div>
                                    <div class="hint" data-i18n="ferry_setting_in_keepass_hint"></div>
                                </div>
                                <button class="btn btn-default ferry-open-keepass-options" type="button" data-i18n="ferry_open_keepass_options"></button>
                            </div>
                            <div class="setting" id="expiry">
                                <div class="setting-text">
                                    <div class="setting-title" data-i18n="ferry_setting_expiryMode"></div>
                                    <div class="hint" data-i18n="ferry_setting_in_keepass_hint"></div>
                                </div>
                                <button class="btn btn-default ferry-open-keepass-options" type="button" data-i18n="ferry_open_keepass_options"></button>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_searchAllOpenDBs_label"></span></span><input type="checkbox" class="switch" id="pref_searchAllOpenDBs_label" /></label>
                            </div>
                        </section>

                        <section class="card" id="panelSavingEntries">
                            <h2 data-i18n="pref_SavingEntries_heading"></h2>
                            <div class="checkbox">
                                <label class="nonSiteSpecificField setting"><span class="setting-text"><span data-i18n="pref_notifyBarRequestPasswordSave_label"></span></span><input type="checkbox" class="switch" id="pref_notifyBarRequestPasswordSave_label"></label>
                            </div>
                            <div class="checkbox nonSiteSpecificField">
                                <label class="setting"><span class="setting-text"><span data-i18n="show_confirmation_after_save"></span></span><input type="checkbox" class="switch" id="pref_showConfirmationAfterSave_label" /></label>
                            </div>
                            <div class="checkbox nonSiteSpecificField">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_preferToSkipWhere_label"></span></span><input type="checkbox" class="switch" id="pref_rememberMRUGroup_label" /></label>
                            </div>
                            <div class="checkbox nonSiteSpecificField">
                                <label class="setting"><span class="setting-text"><span data-i18n="pref_saveFavicons_label"></span></span><input type="checkbox" class="switch" id="pref_saveFavicons_label" /></label>
                            </div>
                        </section>

                        <section class="card" id="panelAppearance">
                            <h2 data-i18n="pref_Appearance_heading"></h2>
                            <div class="form-horizontal">
                                <div class="form-group formSettingGroup setting">
                                    <div class="formSettingLabel setting-text"><span data-i18n="theme"></span><span class="hint" data-i18n="theme_system_preference_explanation"></span></div>
                                    <div class="formSettingDropdown">
                                        <select class="form-control" id="pref_theme_desc">
                                            <option value="" data-i18n="system_preference"></option>
                                            <option value="light" data-i18n="light"></option>
                                            <option value="dark" data-i18n="dark"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section class="card" id="panelFindingForms">
                            <h2 data-i18n="pref_Finding_forms_heading"></h2>
                            <div class="intro">
                                <p data-i18n="site_options_valid_form_intro_desc"></p>
                                <p data-i18n="site_options_list_explain_desc"></p>
                                <p data-i18n="site_options_invisible_tip_desc"></p>
                            </div>
                            <div class="list-columns">
                                <fieldset class="fix-border">
                                    <legend class="fix-border" data-i18n="white_list"></legend>
                                    <div class="grid">
                                        <label for="sssWhiteFormName"><span data-i18n="form_name"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssWhiteFormName" type="text" />
                                        </div>
                                        <label for="sssWhiteFormId"><span data-i18n="form_id"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssWhiteFormId" type="text" />
                                        </div>
                                        <label for="sssWhiteFieldName"><span data-i18n="text_field_name"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssWhiteFieldName" type="text" />
                                        </div>
                                        <label for="sssWhiteFieldId"><span data-i18n="text_field_id"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssWhiteFieldId" type="text" />
                                        </div>
                                    </div>
                                </fieldset>
                                <fieldset class="fix-border">
                                    <legend class="fix-border" data-i18n="black_list"></legend>
                                    <div class="grid">
                                        <label for="sssBlackFormName"><span data-i18n="form_name"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssBlackFormName" type="text" />
                                        </div>
                                        <label for="sssBlackFormId"><span data-i18n="form_id"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssBlackFormId" type="text" />
                                        </div>
                                        <label for="sssBlackFieldName"><span data-i18n="text_field_name"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssBlackFieldName" type="text" />
                                        </div>
                                        <label for="sssBlackFieldId"><span data-i18n="text_field_id"></span></label>
                                        <div class="input-group formFindingControlGroup">
                                            <span class="input-group-addon"><input class="siteSpecificToggle" type="checkbox" aria-label="..."></span>
                                            <input class="form-control" id="sssBlackFieldId" type="text" />
                                        </div>
                                    </div>
                                </fieldset>
                            </div>
                        </section>

                        <section class="card" id="panelAdvanced">
                            <h2 data-i18n="pref_Advanced_heading"></h2>
                            <div class="form-horizontal">
                                <div class="form-group formSettingGroup setting">
                                    <div class="formSettingLabel setting-text"><span data-i18n="pref_currentSearchTermTimeout_label"></span></div>
                                    <div class="formSettingInput narrow">
                                        <input class="form-control" id="pref_currentSearchTermTimeout_label" type="number" min="1" max="65535" step="1">
                                    </div>
                                </div>
                            </div>
                            <div class="checkbox">
                                <label class="setting"><span class="setting-text"><span data-i18n="ferry_diag_label"></span><span class="hint" data-i18n="ferry_diag_hint"></span></span><input type="checkbox" class="switch" id="ferryDiagnostics" /></label>
                            </div>
                        </section>

                    </form>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="./main.ts"></script>
    <script type="module" src="./ferry.ts"></script>
</body>

</html>
